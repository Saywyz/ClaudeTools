# =============================================================
# ClaudeTools — Mise à jour automatique des actualités (Option B)
# -------------------------------------------------------------
# Tourne sur les serveurs de GitHub — votre ordinateur peut être éteint.
# Chaque lundi (et à la demande), régénère assets/data/news.js avec
# les dernières actualités Claude, puis commit + push.
#
# 🔑 PRÉREQUIS (une seule fois) :
#    Settings → Secrets and variables → Actions → New repository secret
#    Nom : ANTHROPIC_API_KEY   Valeur : votre clé d'API Anthropic
#
# ▶️ Tester tout de suite : onglet Actions → ce workflow → « Run workflow ».
# =============================================================
name: Mettre à jour les actualités

on:
  workflow_dispatch: {}            # déclenchement manuel (bouton « Run workflow »)
  schedule:
    - cron: "0 6 * * 1"            # tous les lundis à 06:00 UTC = 08:00 Europe/Paris (été)

permissions:
  contents: write                  # nécessaire pour commit + push

# Évite les exécutions simultanées qui se marcheraient dessus.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer le SDK Anthropic
        run: npm install @anthropic-ai/sdk

      - name: Régénérer assets/data/news.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MODEL: claude-sonnet-4-6      # passez à claude-opus-4-8 pour une curation plus fine
        run: node scripts/update-news.mjs

      - name: Commit & push si changement
        run: |
          if [[ -n "$(git status --porcelain assets/data/news.js)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/data/news.js
            git commit -m "chore: maj actualités"
            git push
          else
            echo "Aucun changement d'actualités cette semaine."
          fi
